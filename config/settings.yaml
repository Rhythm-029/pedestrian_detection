project:
  name: pedestrian_detection_vehicle

zones:
  danger_distance_m: 1.0
  caution_distance_m: 2.0
  minimum_confidence: 0.50
  recovery_clear_seconds: 2.0
  debounce_frames: 3

communication:
  baud_rate: 115200
  heartbeat_period_ms: 100
  heartbeat_timeout_ms: 300   # corrected from 500 — matches original spec
  max_message_age_ms: 300

safety:
  startup_motor_enable: false
  stop_on_invalid_message: true
  stop_on_heartbeat_timeout: true
  stop_on_ultrasonic_danger: true
  ultrasonic_danger_threshold_cm: 50   # cm — within calibrated range (10–75 cm)
  ultrasonic_danger_threshold_m: 0.50  # metres equivalent

sensors:
  ultrasonic:
    calibration_method: piecewise_linear
    calibration_range_cm: [10, 75]
    sample_rate_hz: 20
    danger_threshold_cm: 50

camera:
  inference_width: 320
  inference_height: 320
  capture_width: 640
  capture_height: 480
  fps_target: 15

distance_estimation:
  method: "pinhole_bbox_height"
  formula: "d = k / h_bbox"
  default_k: 310.5
  calibrated_mae_m: 0.008
